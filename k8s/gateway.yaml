apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: mohammed11cpu/elearning-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: elearning-config
                  key: FRONTEND_ORIGIN
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: elearning-config
                  key: AUTH_SERVICE_URL
            - name: COURSE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: elearning-config
                  key: COURSE_SERVICE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: elearning-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30090
