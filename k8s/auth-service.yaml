apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: auth-service
          image: mohammed11cpu/elearning-auth:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - npx prisma migrate deploy && npm start
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: elearning-secrets
                  key: AUTH_DATABASE_URL
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: elearning-config
                  key: FRONTEND_ORIGIN
            - name: GATEWAY_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: elearning-config
                  key: GATEWAY_ORIGIN
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: elearning-config
                  key: AUTH_CORS_ORIGINS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: elearning-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: elearning-config
                  key: JWT_EXPIRES_IN
            - name: REFRESH_EXPIRES_DAYS
              valueFrom:
                configMapKeyRef:
                  name: elearning-config
                  key: REFRESH_EXPIRES_DAYS
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
