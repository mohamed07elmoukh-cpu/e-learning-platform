apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: course-catalog-service
  template:
    metadata:
      labels:
        app: course-catalog-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: course-catalog-service
          image: mohammed11cpu/elearning-catalog:latest
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - npx prisma migrate deploy && npm start
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8082"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: elearning-secrets
                  key: CATALOG_DATABASE_URL
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: elearning-config
                  key: CATALOG_CORS_ORIGINS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: elearning-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: course-catalog-service
spec:
  selector:
    app: course-catalog-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
